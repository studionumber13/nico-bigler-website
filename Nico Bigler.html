<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico Bigler — Communications Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --onyx:#090A0C;
  --graphite:#323338;
  --charcoal:#5A5B64;
  --pale-slate:#AAABBC;
  --pale-light:#D3D3D9;
  --white:#FFFFFF;
  --mx:80px;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--onyx);color:var(--pale-light);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;font-size:16px;line-height:1.6;opacity:0;transition:opacity .4s ease;}
body.body-loaded{opacity:1;}
img{display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--white);color:var(--onyx);}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:var(--onyx);border-bottom:1px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 var(--mx);transform:translateY(-100%);transition:border-bottom-color .3s ease;}
.nav.nav-loaded{transform:translateY(0);transition:transform .5s var(--ease) .2s,border-bottom-color .3s ease;}
.nav.nav-scrolled{border-bottom-color:var(--charcoal);}
.nav-brand{font-family:'Inter',sans-serif;font-size:13px;white-space:nowrap;}
.nav-brand strong{font-weight:600;color:var(--pale-light);}
.nav-brand em{font-style:normal;font-weight:400;color:var(--charcoal);}
.nav-links{display:flex;gap:32px;align-items:center;}
.nav-link{font-family:'Inter',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--pale-slate);padding-bottom:3px;border-bottom:1px solid transparent;transition:color .2s ease,border-color .2s ease;}
.nav-link:hover{color:var(--pale-light);}
.nav-link.active{color:var(--white);border-bottom-color:var(--white);}

/* HERO */
.hero{position:relative;height:100vh;min-height:640px;background:var(--onyx);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:56px;}
.marker{position:absolute;width:6px;height:6px;background:var(--charcoal);}
.marker.tl{top:80px;left:32px;}
.marker.tr{top:80px;right:32px;}
.marker.bl{bottom:32px;left:32px;}
.marker.br{bottom:32px;right:32px;}
.hero-inner{display:flex;flex-direction:column;align-items:center;}
.hero-name{font-family:'Inter',sans-serif;font-weight:900;font-size:96px;line-height:1;letter-spacing:-0.03em;color:var(--white);margin-bottom:16px;}
.hero-name .letter{display:inline-block;opacity:0;transform:translateY(-60px);animation:letterDrop .7s var(--ease) both;}
.hero-name .letter-space{display:inline-block;width:.26em;}
.hero-role{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--pale-slate);margin-bottom:32px;transition:opacity .4s ease;height:18px;display:flex;align-items:center;justify-content:center;}
.hero-rule{width:120px;height:1px;background:var(--charcoal);margin-bottom:24px;}
.hero-cta{display:flex;gap:12px;align-items:center;justify-content:center;opacity:0;animation:heroCtaIn .5s ease-out 1.3s both;}
.btn-solid{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:12px 28px;background:var(--pale-light);color:var(--onyx);border:none;border-radius:4px;cursor:pointer;transition:background .2s ease,transform .2s ease,box-shadow .2s ease;display:inline-block;}
.btn-solid:hover{background:var(--white);transform:translateY(-2px);box-shadow:0 8px 24px rgba(211,211,217,0.15);}
.btn-solid:active{transform:scale(0.97);transition-duration:.1s;}
.btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:12px 28px;background:transparent;color:var(--pale-light);border:1px solid var(--charcoal);border-radius:4px;cursor:pointer;transition:border-color .2s ease,transform .2s ease;display:inline-block;}
.btn-outline:hover{border-color:var(--pale-light);transform:translateY(-2px);}
.btn-outline:active{transform:scale(0.97);transition-duration:.1s;}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.15em;color:var(--charcoal);white-space:nowrap;}

/* WORK */
.work{background:var(--onyx);padding:120px var(--mx);}
.work-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--charcoal);margin-bottom:48px;}
.work-item{position:relative;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:32px;padding:40px 0;border-top:1px solid var(--graphite);transition:background .3s ease;overflow:hidden;}
.work-item:last-child{border-bottom:1px solid var(--graphite);}
.work-item::before{content:'';position:absolute;left:0;top:0;width:2px;height:0;background:var(--white);transition:height .3s ease-out;}
.work-item:hover{background:rgba(255,255,255,0.02);}
.work-item:hover::before{height:100%;}
.work-item:hover .work-item-arrow{color:var(--white);transform:translateX(6px);}
.work-item:hover .work-item-num{color:var(--pale-slate);}
.work-item-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--charcoal);align-self:flex-start;padding-top:6px;transition:color .25s ease;}
.work-item-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--charcoal);margin-bottom:10px;}
.work-item-title{font-family:'Inter',sans-serif;font-weight:500;font-size:28px;line-height:1.2;letter-spacing:-0.01em;color:var(--white);margin-bottom:12px;}
.work-item-desc{font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;color:var(--pale-slate);max-width:520px;}
.work-item-arrow{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--charcoal);transition:color .25s ease,transform .25s ease;align-self:center;flex-shrink:0;}

/* MARQUEE */
.marquee{background:var(--graphite);padding:14px 0;overflow:hidden;white-space:nowrap;transition:opacity .3s;}
.marquee:hover{opacity:.6;}
.marquee:hover .marquee-track{animation-play-state:paused;}
.marquee-track{display:inline-block;animation:marquee 25s linear infinite;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--charcoal);}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* FOOTER */
.footer{background:var(--onyx);padding:80px var(--mx);overflow:hidden;}
.footer-top-rule{height:1px;background:var(--graphite);margin-bottom:80px;}
.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-bottom:80px;}
.footer-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--charcoal);margin-bottom:24px;}
.footer-heading{margin-bottom:32px;}
.footer-heading .h-white{font-family:'Inter',sans-serif;font-weight:900;font-size:56px;line-height:1;color:var(--white);display:block;}
.footer-heading .h-dim{font-family:'Inter',sans-serif;font-weight:900;font-size:56px;line-height:1;color:var(--charcoal);display:block;}
.footer-email{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--pale-slate);transition:color .2s ease;}
.footer-email:hover{color:var(--white);text-decoration:underline;text-decoration-color:var(--charcoal);}
.form-field{width:100%;background:transparent;border:none;border-bottom:1px solid var(--graphite);color:var(--pale-light);font-family:'Inter',sans-serif;font-size:15px;padding:14px 0;margin-bottom:20px;outline:none;transition:border-bottom-color .2s ease;display:block;}
textarea.form-field{resize:none;}
.form-field::placeholder{color:var(--charcoal);}
.form-field:focus{border-bottom-color:var(--pale-light);}
.btn-submit{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:14px 32px;background:var(--pale-light);color:var(--onyx);border:none;border-radius:4px;cursor:pointer;transition:background .2s ease,transform .2s ease,box-shadow .2s ease;}
.btn-submit:hover{background:var(--white);transform:translateY(-2px);box-shadow:0 8px 24px rgba(211,211,217,0.15);}
.btn-submit:active{transform:scale(0.97);transition-duration:.1s;}
.footer-cv-links{margin-top:20px;display:flex;gap:24px;flex-wrap:wrap;}
.footer-cv-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--charcoal);transition:color .2s ease;}
.footer-cv-link:hover{color:var(--pale-light);}
.footer-bottom-rule{height:1px;background:var(--graphite);margin-bottom:24px;}
.footer-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
.footer-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--charcoal);letter-spacing:0.04em;}
.footer-meta a{color:inherit;}
.footer-meta a:hover{color:var(--pale-slate);}
.footer-bottom-mid{text-align:center;}
.footer-bottom-right{text-align:right;}
.footer-ghost{font-family:'Inter',sans-serif;font-weight:900;font-size:160px;line-height:1;color:var(--graphite);opacity:0.5;white-space:nowrap;pointer-events:none;user-select:none;margin-top:-20px;letter-spacing:-0.04em;}

/* WIPE */
.wipe{position:fixed;inset:0;z-index:1000;background:var(--onyx);opacity:0;pointer-events:none;transition:opacity .42s ease;}
.wipe.on{opacity:1;pointer-events:auto;}
.wipe .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--pale-slate);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;opacity:0;transition:opacity .3s ease .12s;}
.wipe.on .lbl{opacity:1;}

/* CURSOR */
.cursor-dot{width:6px;height:6px;background:var(--pale-light);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;left:-100px;top:-100px;transition:opacity .2s;}
.cursor-ring{width:36px;height:36px;border:1px solid var(--charcoal);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;left:-100px;top:-100px;transition:width .2s,height .2s,border-color .2s;}
.cursor-dot.dot-hide{opacity:0;}
.cursor-ring.ring-hover{width:48px;height:48px;border-color:var(--white);}

/* SCROLL ANIMATIONS */
.anim{opacity:0;transform:translateY(28px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.anim.anim-visible{opacity:1;transform:translateY(0);}

/* KEYFRAMES */
@keyframes letterDrop{to{opacity:1;transform:translateY(0);}}
@keyframes heroCtaIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:1024px){
  :root{--mx:48px;}
  .hero-name{font-size:72px;}
  .footer-grid{grid-template-columns:1fr;gap:56px;}
  .footer-heading .h-white,.footer-heading .h-dim{font-size:44px;}
  .footer-ghost{font-size:120px;}
}
@media(max-width:768px){
  :root{--mx:24px;}
  .nav-links{display:none;}
  .hero-name{font-size:52px;}
  .hero-cta{flex-direction:column;width:100%;max-width:280px;}
  .btn-solid,.btn-outline{text-align:center;}
  .work{padding:80px var(--mx);}
  .work-item{grid-template-columns:36px 1fr;}
  .work-item-arrow{display:none;}
  .footer-bottom{grid-template-columns:1fr;gap:8px;}
  .footer-bottom-mid,.footer-bottom-right{text-align:left;}
  .footer-ghost{font-size:72px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:.01ms!important;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

const ROLES = ["Communications Specialist","Brand Manager","Visual Strategist"];

const WORK = [
  {num:"01",company:"PRIVATBANK BERGOS AG · 2024–2025",
   title:"Communications & Brand Manager",
   desc:"Built and governed the complete visual identity system — brand center, editorial publications, digital assets for next-generation HNWI clients.",
   href:"bergos.html"},
  {num:"02",company:"SOCIALDESIGN AG · 2023–2024",
   title:"Communications Specialist",
   desc:"Developed strategic communication concepts and campaigns for social innovation projects across Switzerland.",
   href:"socialdesign.html"},
  {num:"03",company:"KANTON BERN — KAD · 2022–2023",
   title:"Communications & Campaigns",
   desc:"Created public health campaigns and managed digital communications for the cantonal medical service of Bern.",
   href:"kantonnbern.html"},
];

const MARQUEE_TEXT = "COMMUNICATIONS · BRAND STRATEGY · ZÜRICH · VISUAL IDENTITY · COVER DESIGN · CULTURAL EDGE · PROJECT NR. 13 · SWITZERLAND · ";

function Cursor(){
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const mouse = useRef({x:-100,y:-100});
  const ring = useRef({x:-100,y:-100});
  const raf = useRef(null);
  const isTouch = typeof window!=='undefined' && window.matchMedia('(hover:none)').matches;

  useEffect(()=>{
    if(isTouch) return;
    const lerp=(a,b,t)=>a+(b-a)*t;
    const onMove=(e)=>{
      mouse.current={x:e.clientX,y:e.clientY};
      if(dotRef.current){
        dotRef.current.style.left=e.clientX+'px';
        dotRef.current.style.top=e.clientY+'px';
      }
    };
    const tick=()=>{
      ring.current.x=lerp(ring.current.x,mouse.current.x,.12);
      ring.current.y=lerp(ring.current.y,mouse.current.y,.12);
      if(ringRef.current){
        ringRef.current.style.left=ring.current.x+'px';
        ringRef.current.style.top=ring.current.y+'px';
      }
      raf.current=requestAnimationFrame(tick);
    };
    const onIn=()=>{
      dotRef.current?.classList.add('dot-hide');
      ringRef.current?.classList.add('ring-hover');
    };
    const onOut=()=>{
      dotRef.current?.classList.remove('dot-hide');
      ringRef.current?.classList.remove('ring-hover');
    };
    document.addEventListener('mousemove',onMove);
    document.querySelectorAll('a,button').forEach(el=>{
      el.addEventListener('mouseenter',onIn);
      el.addEventListener('mouseleave',onOut);
    });
    raf.current=requestAnimationFrame(tick);
    return ()=>{
      document.removeEventListener('mousemove',onMove);
      cancelAnimationFrame(raf.current);
    };
  },[]);

  if(isTouch) return null;
  return (
    <>
      <div ref={dotRef} className="cursor-dot"></div>
      <div ref={ringRef} className="cursor-ring"></div>
    </>
  );
}

function Nav(){
  const [active,setActive]=useState("work");
  const links=[
    {id:"work",label:"Work",href:"#work"},
    {id:"about",label:"About",href:"#about"},
    {id:"journal",label:"Journal",href:"#journal"},
    {id:"cv",label:"CV",href:"#"},
  ];
  return (
    <nav className="nav">
      <a className="nav-brand" href="#top">
        <strong>Nico Bigler</strong>
        <em> — Communications Specialist</em>
      </a>
      <div className="nav-links">
        {links.map(l=>(
          <a key={l.id}
             className={"nav-link"+(active===l.id?" active":"")}
             href={l.href}
             onClick={()=>setActive(l.id)}
          >{l.label}</a>
        ))}
      </div>
    </nav>
  );
}

function Hero(){
  const [idx,setIdx]=useState(0);
  const [visible,setVisible]=useState(false);
  const letters="NICO BIGLER".split('');

  useEffect(()=>{
    const showT=setTimeout(()=>setVisible(true),1000);
    const t=setInterval(()=>{
      setVisible(false);
      setTimeout(()=>{setIdx(i=>(i+1)%ROLES.length);setVisible(true);},400);
    },3000);
    return ()=>{clearInterval(t);clearTimeout(showT);};
  },[]);

  return (
    <section className="hero" id="top">
      <span className="marker tl"></span>
      <span className="marker tr"></span>
      <span className="marker bl"></span>
      <span className="marker br"></span>
      <div className="hero-inner">
        <h1 className="hero-name">
          {letters.map((l,i)=>
            l===' '
              ? <span key={i} className="letter-space"></span>
              : <span key={i} className="letter" style={{animationDelay:`${i*50}ms`}}>{l}</span>
          )}
        </h1>
        <div className="hero-role" style={{opacity:visible?1:0}}>{ROLES[idx]}</div>
        <div className="hero-rule"></div>
        <div className="hero-cta">
          <a href="#work" className="btn-solid">View work</a>
          <a href="#contact" className="btn-outline">Get in touch</a>
        </div>
      </div>
      <div className="hero-scroll">↓ SCROLL</div>
    </section>
  );
}

function Work(){
  return (
    <section className="work" id="work">
      <div className="work-label anim">SELECTED WORK</div>
      {WORK.map((item,i)=>(
        <a key={i} href={item.href}
           className="work-item anim"
           data-stagger={i*100}>
          <div className="work-item-num">{item.num}</div>
          <div>
            <div className="work-item-meta">{item.company}</div>
            <h3 className="work-item-title">{item.title}</h3>
            <p className="work-item-desc">{item.desc}</p>
          </div>
          <span className="work-item-arrow">→</span>
        </a>
      ))}
    </section>
  );
}

function Marquee(){
  const text=MARQUEE_TEXT.repeat(4);
  return (
    <div className="marquee">
      <div className="marquee-track">{text}</div>
    </div>
  );
}

function Footer({onProject}){
  return (
    <footer className="footer" id="contact">
      <div className="footer-top-rule"></div>
      <div className="footer-grid">
        <div>
          <div className="footer-label anim">GET IN TOUCH</div>
          <div className="footer-heading anim" data-stagger="100">
            <span className="h-white">Let's work</span>
            <span className="h-dim">together.</span>
          </div>
          <a className="footer-email anim" data-stagger="200" href="mailto:hello@nicobigler.ch">hello@nicobigler.ch</a>
        </div>
        <div className="anim" data-stagger="150">
          <form onSubmit={e=>e.preventDefault()}>
            <input className="form-field" type="text" placeholder="Name"/>
            <input className="form-field" type="email" placeholder="Email"/>
            <textarea className="form-field" rows={4} placeholder="Message"></textarea>
            <button className="btn-submit" type="submit">SEND MESSAGE</button>
          </form>
          <div className="footer-cv-links">
            <a href="#" className="footer-cv-link">↓ DOWNLOAD CV — DEUTSCH</a>
            <a href="#" className="footer-cv-link">↓ DOWNLOAD CV — ENGLISH</a>
          </div>
        </div>
      </div>
      <div className="footer-bottom-rule"></div>
      <div className="footer-bottom">
        <span className="footer-meta">© 2026 NICO BIGLER — ZÜRICH</span>
        <div className="footer-meta footer-bottom-mid">
          <a href="#">IMPRESSUM</a>{" · "}<a href="#">DATENSCHUTZ</a>
        </div>
        <div className="footer-meta footer-bottom-right">
          <a href="Project Nr. 13.html" onClick={onProject}>PROJECT NR. 13 →</a>
        </div>
      </div>
      <div className="footer-ghost">NICO BIGLER</div>
    </footer>
  );
}

function App(){
  const [wipe,setWipe]=useState(false);

  useEffect(()=>{
    document.body.classList.add('body-loaded');
    const nav=document.querySelector('.nav');
    if(nav) nav.classList.add('nav-loaded');

    const onScroll=()=>nav?.classList.toggle('nav-scrolled',window.scrollY>60);
    window.addEventListener('scroll',onScroll,{passive:true});

    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const delay=Number(entry.target.dataset.stagger||0);
        if(delay) entry.target.style.transitionDelay=delay+'ms';
        entry.target.classList.add('anim-visible');
        if(delay) setTimeout(()=>{ entry.target.style.transitionDelay=''; },700+delay);
        observer.unobserve(entry.target);
      });
    },{threshold:0.15});

    document.querySelectorAll('.anim').forEach(el=>observer.observe(el));

    return ()=>{
      window.removeEventListener('scroll',onScroll);
      observer.disconnect();
    };
  },[]);

  const goProject=(e)=>{
    e.preventDefault();
    const href=e.currentTarget.getAttribute("href");
    setWipe(true);
    setTimeout(()=>{window.location.href=href;},520);
  };

  return (
    <React.Fragment>
      <Cursor/>
      <Nav/>
      <Hero/>
      <Work/>
      <Marquee/>
      <Footer onProject={goProject}/>
      <div className={"wipe"+(wipe?" on":"")}><div className="lbl">Entering Project Nr. 13</div></div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
